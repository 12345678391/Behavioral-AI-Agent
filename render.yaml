services:
  - type: web
    name: behavioral-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: behavioral-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python agent/agent.py start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8081
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
